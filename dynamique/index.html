<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8" /><meta name="copyright" content="© Atelier KHEM — Tous droits réservés" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="robots" content="index, follow" /><!-- ===================================================== MÉTADONNÉES DYNAMIQUES Ces éléments sont remplis automatiquement par app.js depuis le fichier data/atelier-khem.xml. Ne pas modifier les attributs id= ni les balises. ===================================================== --><!-- Titre de l'onglet du navigateur --><title id="dynamic-title">Atelier KHEM</title><!-- Couleur de la barre du navigateur mobile --><meta name="theme-color" content="#000000" id="dynamic-theme-color" /><!-- URL canonique (évite le contenu dupliqué pour le SEO) --><link rel="canonical" href="" id="dynamic-canonical" /><!-- ===================================================== SCHEMA.ORG Données structurées pour les moteurs de recherche. Remplies automatiquement par app.js depuis le XML. ===================================================== --><script type="application/ld+json" id="dynamic-ld-json"> { "@context": "https://schema.org", "@type": "Organization", "name": "", "url": "", "logo": "" } </script><!-- ===================================================== FAVICONS ===================================================== --><link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" /><link rel="icon" type="image/svg+xml" href="/favicon.svg" /><link rel="shortcut icon" href="/favicon.ico" /><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" /><!-- Manifest PWA (permet l'installation sur mobile comme une app) --><link rel="manifest" href="/site.webmanifest" /><!-- ===================================================== LIBRAIRIES ===================================================== --><!-- Tailwind CSS : classes utilitaires (flex, grid, px-6...) --><script src="https://cdn.tailwindcss.com"></script><!-- GSAP Core : moteur d'animations --><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><!-- ScrollTrigger : déclenche les animations quand une section entre dans l'écran --><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script><!-- ScrollToPlugin : scroll animé vers un élément via goToSection() --><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script><!-- Police Inter (corps de texte) --><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" /><!-- Emoji --><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><!-- Feuille de styles du site --><link rel="stylesheet" href="styles.css" /></head><body><!-- ===================================================== LOADER (ÉCRAN D'ACCUEIL) Affiché pendant le chargement du site. app.js lui ajoute la classe .hidden une fois prêt. ===================================================== --><div id="startup-loader"><div class="startup-loader-content"><!-- Logo : src et alt injectés par app.js depuis <branding> du XML --><div class="startup-loader-logo-wrapper"><img data-site-logo src="img/Logo.jpg" alt="Logo" class="startup-loader-logo" /></div><!-- Ligne lumineuse de scan animée --><div class="startup-loader-line"></div><!-- Texte d'état : injecté par app.js depuis <loaderText> du XML --><div id="startup-loader-text"></div></div></div><!-- ===================================================== GRAIN (TEXTURE DE FOND) Div fixé, invisible aux clics, au-dessus de tout. Stylisé dans styles.css (.noise). ===================================================== --><div class="noise"></div><!-- ===================================================== BLOBS ANIMÉS Cercles colorés flous en arrière-plan. app.js supprime tout ce bloc si <animation>0</animation> est défini dans le XML. ===================================================== --><div id="background-animation"></div><!-- ===================================================== SECTION HÉRO (ACCUEIL) Tous les textes sont injectés par app.js depuis le nœud <accueil> du XML. ===================================================== --><section id="hero" class="flex items-center px-6 py-10 sm:min-h-screen sm:py-24 pb-8 sm:pb-24"><div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-8 sm:gap-16 items-center w-full border-b border-white/10 pb-10 sm:pb-24"><!-- ── COLONNE GAUCHE : texte ── --><div class="space-y-2 sm:space-y-8 section-fade relative text-left"><!-- Ancre de scroll ciblée par goToSection('hero') dans app.js --><div id="hero-anchor" class="scroll-offset"></div><!-- Badge : petite pastille au-dessus du titre (ex : "Atelier KHEM") --><div id="hero-subtitle" class="flex items-center justify-center text-center border rounded-full py-6 text-5xl uppercase font-extralight w-full max-w-[700px] mt-0 mb-8 sm:mb-12" style=" letter-spacing:0.08em; padding-left:3rem; padding-right:2.4rem; border-color:color-mix(in srgb, var(--color-primary) 30%, transparent); color:var(--color-primary); box-shadow: 0 0 40px rgba(198,131,70,.15), 0 0 80px rgba(198,131,70,.08), inset 0 0 25px rgba(198,131,70,.05); " ></div><!-- Titre principal (balise <titre> du XML, peut contenir du HTML) --><h1 id="hero-title" class="titre text-5xl sm:text-6xl md:text-8xl font-light leading-none tracking-tight"></h1><!-- Description courte (balise <intro> du XML) --><p id="hero-description" class="text-base sm:text-xl leading-relaxed max-w-2xl"></p><!-- Boutons CTA (texte et liens viennent du XML) --><div class="flex flex-wrap gap-2 sm:gap-4 pt-1 sm:pt-4"><!-- Bouton 1 : "Découvre nos activités" — scroll vers la 1ère activité --><a id="hero-button" href="#" class="px-3 py-1 text-xs sm:px-8 sm:py-4 sm:text-base rounded-2xl text-black font-semibold hover:scale-105 transition duration-300" style="background: var(--color-primary);"></a><!-- Bouton 2 : "Contacte-nous" — lien WhatsApp externe --><a id="hero-button2" href="#" target="_blank" class="px-3 py-1 text-xs sm:px-8 sm:py-4 sm:text-base rounded-2xl text-black font-semibold hover:scale-105 transition duration-300" style="background: var(--color-primary);"></a></div></div><!-- ── COLONNE DROITE : logo dans un cadre glassmorphism ── --><div class="section-fade"><div class="glass rounded-[2rem] sm:rounded-[3rem] aspect-square flex items-center justify-center relative overflow-hidden"><!-- Halo lumineux couleur primaire (doré) --><div class="absolute w-96 h-96 rounded-full blur-3xl" style="background: color-mix(in srgb, var(--color-primary) 20%, transparent);"></div><!-- Halo lumineux couleur secondaire (vert) --><div class="absolute w-72 h-72 rounded-full blur-3xl" style="background: color-mix(in srgb, var(--color-secondary) 20%, transparent);"></div><!-- Logo centré, au-dessus des halos --><div class="relative z-10 text-center"><img data-site-logo src="img/Logo.jpg" alt="Logo" class="block mx-auto rounded-[2rem] object-contain" /></div></div></div></div></section><!-- ===================================================== ACTIVITÉS Ce conteneur est rempli entièrement par app.js. Chaque <activite> du XML génère une section complète avec sa colonne texte et son panneau vitrine. ===================================================== --><section id="activites" class="pt-0 pb-8 sm:pb-16 px-6"><div id="activities-container" class="max-w-7xl mx-auto space-y-8 sm:space-y-32"></div></section><!-- ===================================================== FOOTER Rempli entièrement par app.js depuis <footer> du XML. ===================================================== --><footer id="footer-cta" class="py-0 sm:py-32 px-6 section-fade scroll-mt-0 sm:scroll-mt-24"></footer><div class="h-96 sm:h-32"></div><!-- ===================================================== BOUTONS FLOTTANTS (coin bas-droit) Cachés par défaut (.hidden), rendus visibles par app.js une fois le site chargé. ===================================================== --><div id="floating-controls" class="fixed !top-1 !right-1 z-[996] flex flex-col gap-2"><!-- Bouton son --><button id="audio-toggle" class="hidden !w-5 !h-5 !min-w-0 !min-h-0 !p-0 rounded-full glass text-[20px] leading-none flex items-center justify-center"><i class="fa-solid fa-volume-xmark" style="color: rgb(116, 163, 9);"></i></button><!-- Bouton blobs --><button id="blob-toggle" class="hidden !w-5 !h-5 !min-w-0 !min-h-0 !p-0 rounded-full glass text-[20px] leading-none flex items-center justify-center"><i class="fa-solid fa-virus-covid" style="color: rgb(99, 230, 190);"></i></button></div><!-- ===================================================== SCRIPT PRINCIPAL Chargé en dernier pour que le DOM soit prêt. app.js lit le XML, construit toute la page et gère les animations, l'audio et la navigation. ===================================================== --><script src="app.js"></script><!-- Système multi-version --><script src="/config.js"></script><script src="/version-switcher.js"></script></body></html>
