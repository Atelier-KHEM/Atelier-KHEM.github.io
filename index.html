<!DOCTYPE html>
<html lang="fr">
	<head>

		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- =========================================================
			 DONNÉES DYNAMIQUES
			 Ces valeurs sont remplacées automatiquement
			 par app.js depuis le fichier XML.
			 ========================================================= -->

		<title id="dynamic-title">Nom du site</title>

		<meta name="robots" content="index, follow">

		<!-- Couleur navigateur mobile -->
		<meta name="theme-color" content="#000000" id="dynamic-theme-color">

		<!-- URL canonique -->
		<link rel="canonical" href="" id="dynamic-canonical">

		<!-- =========================================================
			 FAVICONS
			 ========================================================= -->

		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

		<!-- Manifest PWA -->
		<link rel="manifest" href="/site.webmanifest" />

		<!-- =========================================================
			 SCHEMA.ORG DYNAMIQUE
			 Remplacé automatiquement par app.js
			 ========================================================= -->

		<script type="application/ld+json" id="dynamic-ld-json">
		{
			"@context": "https://schema.org",
			"@type":    "Organization",
			"name":     "",
			"url":      "",
			"logo":     ""
		}
		</script>

		<!-- =========================================================
			 LIBRAIRIES
			 ========================================================= -->

		<script src="https://cdn.tailwindcss.com"></script>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>

		<!-- Police -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

		<!-- =========================================================
			 STYLES
			 ========================================================= -->

		<link rel="stylesheet" href="telma.css">
		<link rel="stylesheet" href="styles.css">

	</head>

	<body>
		<!-- =========================================================
			 LOADER CINÉMATIQUE
			 ========================================================= -->

		<div id="startup-loader">

			<div class="startup-loader-content">

				<!-- Logo dynamique -->
				<img data-site-logo src="img/Logo.png" alt="Logo" class="mx-auto rounded-[2rem] object-contain w-72 h-72"/>

				<div class="startup-loader-line"></div>

				<!-- Texte dynamique -->
				<div id="startup-loader-text"></div>

			</div>

		</div>

		<!-- =========================================================
			 GRAIN
			 ========================================================= -->

		<div class="noise"></div>

		<!-- =========================================================
			 BLOBS ANIMÉS
			 ========================================================= -->

		<div id="alchemic-bg" class="alchemic-bg">

			<div class="blob blob-1"></div>
			<div class="blob blob-2"></div>
			<div class="blob blob-3"></div>
			<div class="blob blob-4"></div>
			<div class="blob blob-5"></div>
			<div class="blob blob-6"></div>
			<div class="blob blob-7"></div>
			<div class="blob blob-8"></div>

		</div>

		<!-- =========================================================
			 HERO
			 ========================================================= -->

		<section id="hero" class="grid min-h-screen flex items-center px-6 py-24 border-b border-white/10">

			<div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-16 items-center w-full">

				<!-- =================================================
					 COLONNE GAUCHE
					 ================================================= -->

				<div class="space-y-8 section-fade relative text-left">

					<div id="hero-anchor" class="scroll-offset"></div>

					<!-- Badge -->
					<div
						id="hero-badge"
						class="inline-block border rounded-full px-12 py-6 text-3xl tracking-[0.6em] uppercase font-extralight"
						style="
							border-color: color-mix(in srgb, var(--color-primary) 30%, transparent);
							color: var(--color-primary);
							box-shadow: 0 0 40px rgba(198,131,70,.15);
						">
					</div>

					<!-- Titre -->
					<h1
						id="hero-title"
						class="titre text-6xl md:text-8xl font-light leading-none tracking-tight">
					</h1>

					<!-- Description -->
					<p
						id="hero-description"
						class="text-xl leading-relaxed max-w-2xl"
						style="color: var(--color-text-soft);">
					</p>

					<!-- Boutons -->
					<div class="flex flex-wrap gap-4 pt-4">

						<a
							id="hero-button"
							href="#"
							class="px-8 py-4 rounded-2xl text-black font-semibold hover:scale-105 transition duration-300"
							style="background: var(--color-primary);"
						></a>

						<a
							id="hero-button2"
							href="#"
							target="_blank"
							class="px-8 py-4 rounded-2xl text-black font-semibold hover:scale-105 transition duration-300"
							style="background: var(--color-primary);"
						></a>

					</div>

				</div>

				<!-- =================================================
					 COLONNE DROITE
					 ================================================= -->

				<div class="section-fade">

					<div class="glass rounded-[3rem] aspect-square flex items-center justify-center relative overflow-hidden">

						<!-- Halo principal -->
						<div
							class="absolute w-96 h-96 rounded-full blur-3xl"
							style="
								background:
								color-mix(
									in srgb,
									var(--color-primary) 20%,
									transparent
								);
							">
						</div>

						<!-- Halo secondaire -->
						<div
							class="absolute w-72 h-72 rounded-full blur-3xl"
							style="
								background:
								color-mix(
									in srgb,
									var(--color-secondary) 20%,
									transparent
								);
							">
						</div>

						<!-- Logo -->
						<div class="relative z-10 text-center">

							<img
								data-site-logo
								src="img/Logo.png"
								alt="Logo"
								class="mx-auto rounded-[2rem] object-contain">
						</div>

					</div>

				</div>

			</div>

		</section>

		<!-- =========================================================
			 ACTIVITÉS
			 ========================================================= -->

		<section id="activites" class="py-24 px-6">

			<div
				id="activities-container"
				class="max-w-7xl mx-auto space-y-32">
			</div>

		</section>

		<!-- =========================================================
			 FOOTER
			 ========================================================= -->

		<footer
			id="footer-cta"
			class="py-32 px-6 border-t border-white/10 section-fade scroll-mt-24">
		</footer>

		<!-- =========================================
			 FLOATING CONTROLS
		========================================= -->

		<div
			id="floating-controls"
			class="fixed bottom-6 right-6 z-[99999] flex flex-col gap-3"
		>

			<button
				id="audio-toggle"
				class="hidden w-14 h-14 rounded-full glass text-xl"
			>
				🔇
			</button>

			<button
				id="blob-toggle"
				class="hidden w-14 h-14 rounded-full glass text-xl"
			>
				✨
			</button>

		</div>

		<!-- =========================================================
			 APP
			 ========================================================= -->

		<script src="app.js"></script>

	</body>

</html>
