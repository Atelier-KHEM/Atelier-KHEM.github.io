<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier KHEM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <style>

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#171C22;
      color:#E8E3DD;
      overflow-x:hidden;
    }

    .noise{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.03;
      z-index:9999;

      background-image:
        repeating-radial-gradient(
          circle at 0 0,
          transparent 0,
          #fff 1px,
          transparent 2px
        );
    }

    .glass{
      background:rgba(255,255,255,.04);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,.08);
    }

    .gradient-text{
      background:
        linear-gradient(
          90deg,
          #C68346,
          #1FAF8C
        );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero-bg{
      background:
        radial-gradient(circle at top left,
        rgba(198,131,70,.15),
        transparent 35%),

        radial-gradient(circle at bottom right,
        rgba(31,175,140,.15),
        transparent 35%),

        #171C22;
    }

    .card-hover{
      transition:all .4s ease;
    }

    .card-hover:hover{
      transform:translateY(-8px);
      border-color:rgba(198,131,70,.4);
      background:rgba(255,255,255,.06);
    }

    .section-fade{
      opacity:0;
      transform:translateY(80px);
    }

    .dynamic-image{
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      transition:all .6s ease;
    }

  </style>
</head>
<body>
  <div class="noise"></div>
  <!-- HERO -->
  <section class="hero-bg min-h-screen flex items-center px-6 py-24 border-b border-white/10">
    <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-16 items-center w-full">
      <div class="space-y-8 section-fade">
        <div id="hero-badge" class="inline-block border border-[#C68346]/30 rounded-full px-5 py-2 text-sm tracking-[0.35em] uppercase text-[#C68346]"></div>
        <h1 id="hero-title" class="text-6xl md:text-8xl font-light leading-none tracking-tight"></h1>
        <p id="hero-description" class="text-xl text-[#B7B0A7] leading-relaxed max-w-2xl"></p>
        <div class="flex flex-wrap gap-4 pt-4">
          <a id="hero-button" href="#" class="px-8 py-4 rounded-2xl bg-[#C68346] text-black font-semibold hover:scale-105 transition duration-300"></a>
          <a id="hero-button2" href="#" class="px-8 py-4 rounded-2xl bg-[#C68346] text-black font-semibold hover:scale-105 transition duration-300"></a>
        </div>
      </div>
      <div class="section-fade">
        <div class="glass rounded-[3rem] aspect-square flex items-center justify-center relative overflow-hidden">
          <div class="absolute w-96 h-96 rounded-full bg-[#C68346]/20 blur-3xl"></div>
          <div class="absolute w-72 h-72 rounded-full bg-[#1FAF8C]/20 blur-3xl"></div>
          <div class="relative z-10 text-center space-y-6">
            <div bis_skin_checked="1">

              <div id="khem-image" class="dynamic-image rounded-[2rem] h-[350px] mb-8" style="background-image:url('img/Logo.png')" bis_skin_checked="1"></div>

              <div class="space-y-5" bis_skin_checked="1">

                <h3 id="remk-title" class="text-5xl font-light">
                  Mangue Passion2222
                </h3>

              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- ACTIVITES -->
  <section id="activites" class="py-24 px-6">
    <div id="activities-container" class="max-w-7xl mx-auto space-y-32"></div>
  </section>
  <!-- FOOTER CTA -->
  <footer id="footer-cta" class="py-32 px-6 border-t border-white/10 section-fade"></footer>
  <script src="app.js"></script>
</body>
</html>
